name: 10x-stack-template

# The full local Supabase stack (API/Kong, Auth, Storage, Studio, Postgres) is
# run by the Supabase CLI via `supabase start`, NOT by this compose file --
# `make up` starts it first. Services below reach it on the host:
#   browser/frontend      -> http://localhost:54321
#   in-container worker   -> http://host.docker.internal:54321

services:
  temporal-db:
    image: postgres:15-alpine
    container_name: temporal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5433:5432"
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.21.3
    container_name: temporal
    restart: unless-stopped
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
      - TEMPORAL_CLI_ADDRESS=localhost:7233
    ports:
      - "7234:7233"
    healthcheck:
      test: ["CMD", "true"]
      interval: 10s
      timeout: 5s
      retries: 3

  temporal-ui:
    image: temporalio/ui:2.21.2
    container_name: temporal-ui
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"

  temporal-worker:
    build: ./temporal
    container_name: temporal-worker
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
    # Reach the host-bound Supabase API from inside the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal:7233}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      - TEMPORAL_TASK_QUEUE=${TEMPORAL_TASK_QUEUE:-main}
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:54321}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-dev-service-role-key}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-tavily}
      - SEARCH_FALLBACK_PROVIDER=${SEARCH_FALLBACK_PROVIDER:-}
      - SEARCH_MAX_RESULTS=${SEARCH_MAX_RESULTS:-10}
      - SEARCH_TIMEOUT_SECONDS=${SEARCH_TIMEOUT_SECONDS:-15}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - TAVILY_SEARCH_DEPTH=${TAVILY_SEARCH_DEPTH:-basic}
      # AWS Bedrock: endpoint + region are required; model IDs live in llm_models (admin portal).
      - BEDROCK_ENDPOINT_URL=${BEDROCK_ENDPOINT_URL:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - BEDROCK_BOOTSTRAP_MODEL_ID=${BEDROCK_BOOTSTRAP_MODEL_ID:-}
      - AMAZON_API_ACCESS_KEY=${AMAZON_API_ACCESS_KEY:-}
      - AMAZON_API_SECRET_KEY=${AMAZON_API_SECRET_KEY:-}
      - AMAZON_PARTNER_TAG=${AMAZON_PARTNER_TAG:-}
      - FX_RATES_PROVIDER=${FX_RATES_PROVIDER:-exchangerate_api_open}
      - FX_RATES_FALLBACK_PROVIDER=${FX_RATES_FALLBACK_PROVIDER:-fawazahmed0}
      - HEADLESS_RENDERER_URL=${HEADLESS_RENDERER_URL:-http://renderer:3001}
      - JOB_POLL_INTERVAL_SECONDS=${JOB_POLL_INTERVAL_SECONDS:-2}
      - JOB_CLAIM_BATCH_SIZE=${JOB_CLAIM_BATCH_SIZE:-10}
      - SCOUT_MAX_ITERATIONS=${SCOUT_MAX_ITERATIONS:-12}
      - SCOUT_MAX_FETCHES=${SCOUT_MAX_FETCHES:-25}
      - SCOUT_MAX_TOKENS=${SCOUT_MAX_TOKENS:-60000}

  # Playwright sidecar for JavaScript-heavy retailers (Temu, sometimes Takealot).
  # Only the worker calls it; it is not published to the host.
  renderer:
    build: ./renderer
    container_name: renderer
    restart: unless-stopped
    environment:
      - PORT=3001
      - RENDER_MAX_CONCURRENT=${RENDER_MAX_CONCURRENT:-2}
    expose:
      - "3001"
    shm_size: "512mb"
    mem_limit: 2g

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    depends_on:
      temporal:
        condition: service_started
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-http://localhost:54321}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-dev-anon-key}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:54321/functions/v1}
      # Dev-only email/password login for local testing without Google credentials.
      - VITE_ENABLE_DEV_LOGIN=${VITE_ENABLE_DEV_LOGIN:-false}
    ports:
      - "3000:3000"

volumes:
  temporal-db-data:
